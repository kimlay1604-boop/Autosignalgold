name: Gold signals

on:
  schedule:
    - cron: "*/15 * * * *"        # every 15 minutes, every day (Bitcoin trades on weekends)
  workflow_dispatch:               # lets you press "Run workflow" by hand

permissions:
  contents: write

concurrency:
  group: gold-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run the bot once
        env:
          SIGNALS_OUT: docs/signals.json
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            python bot.py --once --ai
          else
            python bot.py --once
          fi

      - name: Save the signals
        run: |
          git config user.name "gold-bot"
          git config user.email "gold-bot@users.noreply.github.com"
          git add docs/signals.json
          if ! git diff --cached --quiet; then
            git commit -m "Update signals"
            for i in 1 2 3 4; do
              git pull --rebase -X theirs origin "$GITHUB_REF_NAME" && git push && exit 0
              echo "Push failed, retrying ($i)..."
              sleep 5
            done
            exit 1
          fi
